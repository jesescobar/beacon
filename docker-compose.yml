services:
  beacon:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persiste ChromaDB entre reinicios del contenedor
      - chroma_data:/app/chroma_db
      # Monta docs/ para poder actualizar sin rebuilding
      - ./docs:/app/docs

volumes:
  chroma_data:
